name: Build image

on:
  workflow_call:
    inputs:
      app-name:
        description: "Image name in the registry, e.g. orders-api"
        type: string
        required: true
      context:
        description: "Folder that holds the Dockerfile, e.g. src/orders-api"
        type: string
        required: true
      push:
        description: "true = publish from the self-hosted runner, false = build-only check"
        type: boolean
        required: true
    outputs:
      tag:
        description: "Version tag that was published (empty on PR checks)"
        value: ${{ jobs.publish.outputs.tag }}

jobs:
  check:
    if: ${{ !inputs.push }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          push: false
          tags: ${{ inputs.app-name }}:pr-check
          cache-from: type=gha,scope=${{ inputs.app-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app-name }}

  publish:
    if: ${{ inputs.push }}
    runs-on: [self-hosted, lab]
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.REGISTRY }}/${{ inputs.app-name }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
