name: CI

on: # Triggers with
  push:
    branches: [main] # every merge to main
    tags: ['v*']
  pull_request: # every PR, on every new commit
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you running this manually?"
        type: string
        required: false
        default: "manual test"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read        # for actions/checkout
      pull-requests: read   # on PRs, paths-filter asks the GitHub API for the changed files
    outputs:
      orders: ${{ steps.filter.outputs.orders == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
      inventory: ${{ steps.filter.outputs.inventory == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: |
            orders:
              - 'src/orders-api/**'
              - 'tests/OrdersApi.Tests/**'
              - 'devops-lab.slnx'
              - '.github/workflows/ci.yml'
              - '.github/workflows/build-image.yml'
            inventory:
              - 'src/inventory-api/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/build-image.yml'

  build: # job id; the ruleset will require "build"
    needs: changes
    if: needs.changes.outputs.orders == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v7 # get the code; the runner starts empty

      - name: Show variable and secret
        env:
          APP_NAME: ${{ vars.APP_NAME }}
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          echo "App name: $APP_NAME"
          echo "Secret: $DEMO_SECRET"
          echo "Secret length: ${#DEMO_SECRET}"

      - name: Show trigger
        env:
          EVENT: ${{ github.event_name }}
          REASON: ${{ inputs.reason }}
        run: |
          echo "Triggered by $EVENT. Reason: ${REASON:-n/a}"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - name: Compute short tag
        id: vars
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
  
  test:
    needs: [changes, build]
    if: needs.changes.outputs.orders == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Show tag from build
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          echo "Testing commit $TAG"
      - name: Test
        run: dotnet test -c Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          retention-days: 7
  
  orders-image:
    needs: [changes, test]
    if: needs.changes.outputs.orders == 'true'
    uses: ./.github/workflows/build-image.yml
    with:
      app-name: orders-api
      context: src/orders-api
      push: ${{ github.event_name == 'push'}}

  inventory-test:
    needs: changes
    if: needs.changes.outputs.inventory == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/inventory-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/inventory-api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  inventory-image:
    needs: [changes, inventory-test]
    if: needs.changes.outputs.inventory == 'true'
    uses: ./.github/workflows/build-image.yml
    with:
      app-name: inventory-api
      context: src/inventory-api
      push: ${{ github.event_name == 'push' }}