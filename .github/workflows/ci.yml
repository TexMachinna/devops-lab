name: CI

on: # Triggers with
    push:
        branches: [main] # every merge to main
        paths: &dotnet_paths
          - 'src/orders-api/**'
          - 'tests/OrdersApi.Tests/**'
          - 'devops-lab.slnx'
          - '.github/workflows/ci.yml'
    pull_request: # every PR, on every new commit
      paths: *dotnet_paths
    workflow_dispatch:
      inputs:
        reason:
          description: 'Why are you running this manually?'
          type: string
          required: false
          default: 'manual test'

jobs:
    build: # job id; the ruleset will require "build"
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6 # get the code; the runner starts empty

            - name: Show trigger
              env:
                EVENT: ${{ github.event_name }}
                REASON: ${{ inputs.reason }}
              run: | 
                echo "Triggered by $EVENT. Reason: ${REASON:-n/a}"

            - uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: "10.0.x"

            - name: Restore
              run: dotnet restore # download NuGet packages

            - name: Build
              run: dotnet build --no-restore -c Release

            - name: Test
              run: dotnet test --no-build -c Release
